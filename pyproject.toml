[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-scid"
version = "0.2.0"
description = "Read, write and search SCID chess databases"
requires-python = ">=3.10"
dependencies = ["chess>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["scid"]
